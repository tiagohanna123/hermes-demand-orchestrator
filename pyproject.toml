[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-demand-orchestrator"
version = "1.0.0"
description = "Orquestrador de Demandas — write-ahead log, swarm cascade, preflight classifier, multi-project router"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Tiago Hanna", email = "tiagohanna123@gmail.com" },
]
keywords = ["orquestrador", "demanda", "write-ahead", "cascade", "agent", "workflow", "kanban"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/tiagohanna123/hermes-demand-orchestrator"
Repository = "https://github.com/tiagohanna123/hermes-demand-orchestrator"
Issues = "https://github.com/tiagohanna123/hermes-demand-orchestrator/issues"
Documentation = "https://github.com/tiagohanna123/hermes-demand-orchestrator#readme"

[project.scripts]
hermes-orq = "hermes_demand_orchestrator.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mypy>=1.10",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "pre-commit>=3.8",
    "build>=1.2",
]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/hermes_demand_orchestrator"]
omit = [
    "*/__main__.py",
    "*/_version.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "dist", "build", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "S",    # bandit security
    "B",    # bugbear
    "SIM",  # simplify
]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"__init__.py" = ["F401"]
"src/hermes_demand_orchestrator/__main__.py" = ["S105"]

[tool.ruff.format]
preview = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
strict_optional = true
check_untyped_defs = true
exclude = [".venv", "dist", "build"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line_length = 100
target_version = ["py311"]
