name: Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint (flake8)
      run: |
        python -m flake8 src/ tests/ --max-line-length=100 --count

    - name: Type check (mypy)
      run: |
        python -m mypy src/hermes_demand_orchestrator/

    - name: Run tests with coverage
      run: |
        python -m pytest tests/ --cov=src/hermes_demand_orchestrator --cov-report=term --cov-fail-under=90

    - name: Build package
      run: |
        python -m build

    - name: Check version
      run: |
        python -c "import hermes_demand_orchestrator; print(f'hermes-demand-orchestrator v{hermes_demand_orchestrator.__version__}')"

    - name: Verify package installs
      run: |
        pip install dist/*.whl
        hermes-orq --help
