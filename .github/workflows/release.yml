name: Release

on:
  release:
    types: [created]
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint (flake8)
      run: |
        python -m flake8 src/ tests/ --max-line-length=100 --count

    - name: Type check (mypy)
      run: |
        python -m mypy src/hermes_demand_orchestrator/

    - name: Run tests with coverage
      run: |
        python -m pytest tests/ --cov=src/hermes_demand_orchestrator --cov-report=term --cov-fail-under=90

    - name: Build package
      run: |
        python -m build

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: |
        python -m build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Extract changelog for this version
      id: changelog
      shell: bash
      run: |
        TAG="${GITHUB_REF_NAME}"
        VERSION="${TAG#v}"
        awk -v ver="$VERSION" '
          /^## \[/ {
            if (found) exit
            if ($0 ~ "\\[" ver "\\]") found=1
            next
          }
          found { print }
        ' CHANGELOG.md > /tmp/release_body.md
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "body<<EOF" >> "$GITHUB_OUTPUT"
        cat /tmp/release_body.md >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: v${{ steps.changelog.outputs.version }}
        body: ${{ steps.changelog.outputs.body }}
        files: |
          dist/*.whl
          dist/*.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
